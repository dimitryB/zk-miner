[package]
name = "hemi-macos-hybrid-proof"
version = "0.1.0"
edition = "2021"
publish = false

# An isolated engine acceptance harness, before worker/marketplace integration.
[workspace]

[features]
default = ["hybrid"]
hybrid = ["prove", "risc0-zkvm/metal-hybrid"]
prove = ["risc0-zkvm/prove"]

[[bin]]
name = "hemi-macos-hybrid-proof"
path = "../macos-proof/src/main.rs"

[dependencies]
risc0-zkp = { git = "https://github.com/hemilabs/risc0", rev = "f8dcbdf8", default-features = false }
anyhow = "1"
bincode = "1.3"
hex = "0.4"
serde_json = "1"
sha2 = "0.10"
risc0-zkvm = { git = "https://github.com/hemilabs/risc0", rev = "f8dcbdf8", default-features = false, features = ["std", "disable-dev-mode"] }
risc0-binfmt = { git = "https://github.com/hemilabs/risc0", rev = "f8dcbdf8", default-features = false }
risc0-zkos-v1compat = { git = "https://github.com/hemilabs/risc0", rev = "f8dcbdf8" }

[profile.release]
opt-level = 3
